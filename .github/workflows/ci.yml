# CI of pcldb prototype_0 (specification section 14).
#
# The repository is private, so runner minutes are metered (Windows counts double, macOS ten
# times): every push and pull request runs Windows with Python 3.11 and 3.14 and Ubuntu 26.04
# with Python 3.13; macOS runs only when started by hand (Actions tab, "Run workflow").
#
# PostgreSQL: each image's own programs are used (Windows: the PGBIN folder of the image,
# PostgreSQL 17; Ubuntu 26.04: the newest /usr/lib/postgresql/*/bin, PostgreSQL 18; macOS:
# PostgreSQL 18 from Homebrew), found through PCLDB_PG_BIN. The tests and the smoke make their
# own temporary clusters on free ports; the image's own database service is never started.
#
# The same steps in every job: install the requirements, the unit tests with
# PCLDB_REQUIRE_POSTGRES=1, the PostgreSQL tests again with wrong PG* variables (the Windows
# image sets PGUSER, PGPASSWORD and PGDATA machine-wide; pcldb must ignore them), the
# end-to-end smoke on both engines, and the SQLite path on a bare Python without psycopg and
# globus-sdk.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
          - os: ubuntu-26.04
            python: "3.13"
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-globus.txt

      - name: Make PostgreSQL's programs findable (Windows image, PGBIN)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = $env:PGBIN
          if (-not $bin -or -not (Test-Path -LiteralPath (Join-Path $bin 'initdb.exe'))) {
            Write-Error "The image's PGBIN folder ($bin) has no initdb.exe."
            exit 1
          }
          & (Join-Path $bin 'postgres.exe') --version
          "PCLDB_PG_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Make PostgreSQL's programs findable (Ubuntu image, newest /usr/lib/postgresql/*/bin)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bin=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)
          test -x "$bin/initdb" && test -x "$bin/pg_ctl" && test -x "$bin/postgres"
          "$bin/postgres" --version
          echo "PCLDB_PG_BIN=$bin" >> "$GITHUB_ENV"

      - name: Install requirements.txt and requirements-globus.txt
        run: python -m pip install -r requirements.txt -r requirements-globus.txt

      - name: Unit tests (PostgreSQL required)
        env:
          PCLDB_REQUIRE_POSTGRES: "1"
        run: python -B -m unittest discover -s tests -t .

      - name: PostgreSQL tests again with wrong PG* variables (pcldb must ignore them)
        env:
          PCLDB_REQUIRE_POSTGRES: "1"
          PGUSER: not-a-user
          PGPASSWORD: not-the-password
          PGDATA: ${{ runner.temp }}/no-such-pgdata
          PGHOST: 192.0.2.1
          PGPORT: "1"
          PGDATABASE: no_such_database
        run: python -B -m unittest tests.test_pgcluster tests.test_store tests.test_reader_postgres tests.test_end_to_end

      - name: End-to-end smoke on both engines
        run: python -B tools/smoke.py --engine both

      - name: Bare Python without psycopg and globus-sdk (SQLite smoke and unit tests)
        shell: pwsh
        run: |
          python -m venv --without-pip (Join-Path $env:RUNNER_TEMP 'bare')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $bare = Join-Path $env:RUNNER_TEMP 'bare/bin/python'
          if ($IsWindows) { $bare = Join-Path $env:RUNNER_TEMP 'bare/Scripts/python.exe' }
          foreach ($package in 'psycopg', 'globus_sdk') {
            & $bare -c "import $package" 2>$null
            if ($LASTEXITCODE -eq 0) { Write-Error "$package is installed in the bare Python."; exit 1 }
          }
          & $bare -B tools/smoke.py --engine sqlite
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $bare -B -m unittest discover -s tests -t .
          if ($LASTEXITCODE -ne 0) { exit 1 }

  macos:
    name: macos-latest / Python 3.13 (started by hand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-globus.txt

      - name: Install PostgreSQL 18 from Homebrew and make its programs findable
        shell: bash
        run: |
          brew install postgresql@18
          bin="$(brew --prefix postgresql@18)/bin"
          test -x "$bin/initdb" && test -x "$bin/pg_ctl" && test -x "$bin/postgres"
          "$bin/postgres" --version
          echo "PCLDB_PG_BIN=$bin" >> "$GITHUB_ENV"

      - name: Install requirements.txt and requirements-globus.txt
        run: python -m pip install -r requirements.txt -r requirements-globus.txt

      - name: Unit tests (PostgreSQL required)
        env:
          PCLDB_REQUIRE_POSTGRES: "1"
        run: python -B -m unittest discover -s tests -t .

      - name: PostgreSQL tests again with wrong PG* variables (pcldb must ignore them)
        env:
          PCLDB_REQUIRE_POSTGRES: "1"
          PGUSER: not-a-user
          PGPASSWORD: not-the-password
          PGDATA: ${{ runner.temp }}/no-such-pgdata
          PGHOST: 192.0.2.1
          PGPORT: "1"
          PGDATABASE: no_such_database
        run: python -B -m unittest tests.test_pgcluster tests.test_store tests.test_reader_postgres tests.test_end_to_end

      - name: End-to-end smoke on both engines
        run: python -B tools/smoke.py --engine both

      - name: Bare Python without psycopg and globus-sdk (SQLite smoke and unit tests)
        shell: pwsh
        run: |
          python -m venv --without-pip (Join-Path $env:RUNNER_TEMP 'bare')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $bare = Join-Path $env:RUNNER_TEMP 'bare/bin/python'
          if ($IsWindows) { $bare = Join-Path $env:RUNNER_TEMP 'bare/Scripts/python.exe' }
          foreach ($package in 'psycopg', 'globus_sdk') {
            & $bare -c "import $package" 2>$null
            if ($LASTEXITCODE -eq 0) { Write-Error "$package is installed in the bare Python."; exit 1 }
          }
          & $bare -B tools/smoke.py --engine sqlite
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $bare -B -m unittest discover -s tests -t .
          if ($LASTEXITCODE -ne 0) { exit 1 }
